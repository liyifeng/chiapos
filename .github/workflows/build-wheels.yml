# Modified by assistant: adds build-proofofspace job to build ProofOfSpace binary and publish it as a Release asset (timestamp tag).
# Keep other original jobs intact (build-wheels, build-sdist, check, upload).
on:
  push:
    branches:
      - main
  release:
    types: [published]
  pull_request:
    branches:
      - '**'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/long_lived/')) && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build-wheels:
    name: Wheel - ${{ matrix.os.name }} ${{ matrix.python.major-dot-minor }} ${{ matrix.arch.name }}
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: macOS
            matrix: macos
            runs-on:
              arm: [macOS, ARM64]
              intel: [macos-15-intel]
            cibw-archs-macos:
              arm: arm64
              intel: x86_64
          - name: Ubuntu
            matrix: ubuntu
            runs-on:
              arm: [Linux, ARM64]
              intel: [ubuntu-latest]
          - name: Windows
            matrix: windows
            runs-on:
              intel: [windows-latest]
        python:
          - major-dot-minor: '3.10'
            cibw-build: 'cp310-*'
            manylinux: manylinux_2_28
            matrix: '3.10'
            cibuildwheel: 'cibuildwheel==2.23.3'
          - major-dot-minor: '3.11'
            cibw-build: 'cp311-*'
            manylinux: manylinux_2_28
            matrix: '3.11'
            cibuildwheel: 'cibuildwheel==3.2.1'
          - major-dot-minor: '3.12'
            cibw-build: 'cp312-*'
            manylinux: manylinux_2_28
            matrix: '3.12'
            cibuildwheel: 'cibuildwheel==3.2.1'
          - major-dot-minor: '3.13'
            cibw-build: 'cp313-*'
            manylinux: manylinux_2_28
            matrix: '3.13'
            cibuildwheel: 'cibuildwheel==3.2.1'
          - major-dot-minor: '3.14'
            cibw-build: 'cp314-*'
            manylinux: manylinux_2_28
            matrix: '3.14'
            cibuildwheel: 'cibuildwheel==3.2.1'
        arch:
          - name: ARM
            matrix: arm
          - name: Intel
            matrix: intel
        exclude:
          - os:
              name: Windows
              matrix: windows
              runs-on:
                intel: [windows-latest]
            arch:
              name: ARM
              matrix: arm

    steps:
    - name: Clean workspace
      uses: Chia-Network/actions/clean-workspace@main

    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set Env
      if: env.RUNNER_ARCH != 'ARM64'
      uses: Chia-Network/actions/setjobenv@main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - uses: Chia-Network/actions/setup-python@main
      with:
        python-version: ${{ matrix.python.major-dot-minor }}

    - name: Install pipx
      run: |
        pip install pipx

    - name: Get Windows Bladebit Harvester Artifact
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -eo pipefail
        set -x
        .github/actions/fetch_bladebit_harvester.sh windows x86-64

    - name: Build and test
      env:
        CIBW_PRERELEASE_PYTHONS: True
        CIBW_BUILD: ${{ matrix.python.cibw-build }}
        CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.python.manylinux }}
        CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.python.manylinux }}
        CIBW_ARCHS_MACOS: ${{ matrix.os.cibw-archs-macos[matrix.arch.matrix] }}
      run:
        pipx run --spec=${{ matrix.python.cibuildwheel }} cibuildwheel --output-dir dist 2>&1

    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: packages-${{ matrix.os.name }}-${{ matrix.python.major-dot-minor }}-${{ matrix.arch.name }}
        path: ./dist

  build-sdist:
    name: sdist - ${{ matrix.os.name }} ${{ matrix.python.major-dot-minor }} ${{ matrix.arch.name }}
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Ubuntu
            matrix: ubuntu
            runs-on:
              arm: [Linux, ARM64]
              intel: [ubuntu-latest]
        python:
          - major-dot-minor: '3.12'
            matrix: '3.12'
        arch:
          - name: Intel
            matrix: intel

    steps:
    - name: Clean workspace
      uses: Chia-Network/actions/clean-workspace@main

    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: Chia-Network/actions/setup-python@main
      with:
        python-version: ${{ matrix.python.major-dot-minor }}

    - name: Build source distribution
      run: |
        pip install build
        python -m build --sdist --outdir dist .

    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: packages-sdist-${{ matrix.os.name }}-${{ matrix.python.major-dot-minor }}-${{ matrix.arch.name }}
        path: ./dist

  check:
    name: Check - ${{ matrix.os.name }} ${{ matrix.python.major-dot-minor }} ${{ matrix.arch.name }}
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Ubuntu
            matrix: ubuntu
            runs-on:
              arm: [Linux, ARM64]
              intel: [ubuntu-latest]
        python:
          - major-dot-minor: '3.12'
            matrix: '3.12'
        arch:
          - name: Intel
            matrix: intel

    steps:
    - name: Clean workspace
      uses: Chia-Network/actions/clean-workspace@main

    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: Chia-Network/actions/setup-python@main
      with:
        python-version: ${{ matrix.python.major-dot-minor }}

    - name: flake8
      run: |
        pip install flake8
        flake8 tests setup.py

    - name: mypy
      run: |
        pip install mypy
        mypy --config-file mypi.ini setup.py tests

  upload:
    name: Upload to PyPI - ${{ matrix.os.name }} ${{ matrix.python.major-dot-minor }} ${{ matrix.arch.name }}
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    needs:
      - build-wheels
      - build-sdist
      - check
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Ubuntu
            matrix: ubuntu
            runs-on:
              arm: [Linux, ARM64]
              intel: [ubuntu-latest]
        python:
          - major-dot-minor: '3.12'
            matrix: '3.12'
        arch:
          - name: Intel
            matrix: intel

    steps:
    - name: Clean workspace
      uses: Chia-Network/actions/clean-workspace@main

    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set Env
      uses: Chia-Network/actions/setjobenv@main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - uses: Chia-Network/actions/setup-python@main
      with:
        python-version: ${{ matrix.python.major-dot-minor }}

    - name: Download artifacts
      uses: actions/download-artifact@v6
      with:
        merge-multiple: true
        pattern: packages-*
        path: ./dist

    - name: Publish distribution to PyPI
      if: env.RELEASE == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        skip-existing: true

    - name: Publish distribution to Test PyPI
      if: env.PRE_RELEASE == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist/
        skip-existing: true

  build-proofofspace:
    name: Build ProofOfSpace binary and publish to Release
    runs-on: ubuntu-latest
    needs: []   # independent job; run in parallel with other jobs
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      ARTIFACT_DIR: artifacts
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config git ccache python3 python3-pip

    - name: Build project (try Makefile first, then CMake)
      run: |
        set -euo pipefail
        # prefer top-level Makefile if present
        if [ -f Makefile ] || [ -f makefile ]; then
          echo "Found Makefile in repo root, running make -j"
          make -j$(nproc)
        else
          # try common cmake flow
          if [ -f CMakeLists.txt ]; then
            echo "Found CMakeLists.txt, building with cmake"
            mkdir -p build
            cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release
            cmake --build . --config Release -- -j$(nproc)
            cd ..
          else
            echo "No Makefile or CMakeLists.txt found at repo root. Try building common subdirs."
            built=false
            for d in src build src/chiapos; do
              if [ -f "$d/Makefile" ]; then
                (cd "$d" && make -j$(nproc))
                built=true
              elif [ -f "$d/CMakeLists.txt" ]; then
                (cd "$d" && mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release && cmake --build . -- -j$(nproc))
                built=true
              fi
            done
            if [ "$built" = false ]; then
              echo "No known build entrypoint found. Exiting."
              exit 1
            fi
          fi
        fi

    - name: Collect ProofOfSpace binary
      run: |
        set -euo pipefail
        rm -rf $ARTIFACT_DIR
        mkdir -p $ARTIFACT_DIR
        echo "Searching for 'ProofOfSpace' executables..."
        # search common places (build/, bin/, out/, release/, top-level)
        found=0
        for d in build bin out release src; do
          if [ -d "$d" ]; then
            find "$d" -type f -iname 'ProofOfSpace*' -perm -111 -maxdepth 4 -print -exec cp {} $ARTIFACT_DIR/ \; || true
          fi
        done
        # also search repository root and build tree
        find . -type f -iname 'ProofOfSpace*' -perm -111 -maxdepth 4 -not -path "./.git/*" -print -exec cp {} $ARTIFACT_DIR/ \; || true
        echo "Collected files:"
        ls -lah $ARTIFACT_DIR || true
        if [ -z "$(ls -A $ARTIFACT_DIR 2>/dev/null)" ]; then
          echo "ERROR: No ProofOfSpace binary found. Adjust the 'Collect ProofOfSpace binary' paths."
          exit 1
        fi

    - name: Prepare release tag (UTC timestamp)
      id: tag
      run: |
        # create a timestamp tag, e.g., v20251113T103337  (UTC)
        TS=$(date -u +"%Y%m%d%H%M%S")
        echo "RELEASE_TAG=v${TS}" >> $GITHUB_ENV
        echo "RELEASE_NAME=ProofOfSpace-${TS}" >> $GITHUB_ENV
        echo "RELEASE_BODY=Automated ProofOfSpace binary build from run $GITHUB_RUN_ID" >> $GITHUB_ENV
        echo "Using tag: v${TS}"

    - name: Create GitHub Release (timestamp tag)
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        release_name: ${{ env.RELEASE_NAME }}
        body: ${{ env.RELEASE_BODY }}
        draft: false
        prerelease: false

    - name: Upload ProofOfSpace assets to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.ARTIFACT_DIR }}/ProofOfSpace
        asset_name: ProofOfSpace-${{ env.RELEASE_TAG }}
        asset_content_type: application/octet-stream

    - name: If multiple ProofOfSpace files exist, upload them
      if: ${{ steps.create_release.outputs.upload_url != '' }}
      run: |
        set -euo pipefail
        for f in $(ls -1 ${ARTIFACT_DIR} 2>/dev/null || true); do
          # skip if already uploaded single-named file (handled above)
          if [ "$f" = "ProofOfSpace" ]; then
            continue
          fi
          echo "Uploading ${f} ..."
          gh api --silent --method POST "${{ steps.create_release.outputs.upload_url }}?name=${f}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --input "${ARTIFACT_DIR}/${f}"
        done
      env:
        ARTIFACT_DIR: ${{ env.ARTIFACT_DIR }}
      # gh CLI is not guaranteed available; if you want to use gh, ensure it's installed earlier

    - name: List uploaded assets (debug)
      run: |
        echo "Release created: ${{ env.RELEASE_TAG }}"
        echo "Files in artifacts dir:"
        ls -lah $ARTIFACT_DIR || true
